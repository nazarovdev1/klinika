name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shifo, POSTGRES_PASSWORD: ci, POSTGRES_DB: shifo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shifo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shifo:ci@localhost:5432/shifo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @shifo/api exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @shifo/web e2e:build
      - run: pnpm --filter @shifo/web e2e
        env:
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-xx
          PII_KEYS: k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PII_ACTIVE_KEY_ID: k1
          PII_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          WEB_ORIGIN: http://localhost:3000
      - run: docker compose -f infra/docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: ci
          WEB_ORIGIN: http://localhost
          JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          PII_KEYS: k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PII_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.api -t shifo-api .
      - run: docker build -f infra/Dockerfile.web -t shifo-web .
      - run: docker build -f infra/Dockerfile.mock-dhp -t shifo-mock-dhp .
